name: AgriSecure CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-audit:
    name: Code Quality & Security Auditing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff bandit pip-audit pytest pytest-asyncio hypothesis

      - name: Static Security Scan (Bandit)
        run: |
          bandit -r backend/ -ll

      - name: Lint and Code Formatting (Ruff)
        run: |
          ruff check backend/ tests/

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r backend/requirements.txt

  test-suite:
    name: Automated Unit, Security & Fuzz Tests
    runs-on: ubuntu-latest
    needs: lint-and-audit
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Test Suite with Pytest & Hypothesis
        run: |
          pytest tests/ -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Build and Typecheck React Frontend
        working-directory: ./frontend
        run: |
          npm run build

  container-build:
    name: Container Security & Build Verification
    runs-on: ubuntu-latest
    needs: [test-suite, frontend-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Mosquitto MQTT Container
        run: |
          docker build -t agri-mosquitto:ci ./mqtt

      - name: Build Backend Container
        run: |
          docker build -t agri-backend:ci -f backend/Dockerfile .

      - name: Build Frontend Container
        run: |
          docker build -t agri-frontend:ci ./frontend

      - name: Build Simulator Container
        run: |
          docker build -t agri-simulator:ci ./iot-simulator
