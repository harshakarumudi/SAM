apiVersion: v1
kind: ConfigMap
metadata:
  name: agri-config
  namespace: agri-system
data:
  MQTT_BROKER_HOST: "mqtt-service"
  MQTT_BROKER_PORT: "1883"
  BACKEND_API_URL: "http://backend-service:8000/api"
  RATE_LIMIT_PER_MINUTE: "120"
  MAX_PUMP_RUNTIME_SECONDS: "600"
  SENSOR_WATCHDOG_TIMEOUT_SECONDS: "60"
