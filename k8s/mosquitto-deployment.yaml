apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto-deployment
  namespace: agri-system
  labels:
    app: mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2.0
        ports:
        - containerPort: 1883
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-service
  namespace: agri-system
spec:
  type: ClusterIP
  selector:
    app: mosquitto
  ports:
  - port: 1883
    targetPort: 1883
