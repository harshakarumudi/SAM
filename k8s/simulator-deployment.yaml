apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator-deployment
  namespace: agri-system
  labels:
    app: simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      labels:
        app: simulator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: simulator
        image: agri-simulator:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: agri-config
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
